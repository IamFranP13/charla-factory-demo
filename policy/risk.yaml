# Risk gate policy.
#
# The gate looks at the files a change touches, never at who asked for it.
#   auto  = low risk: the change merges by itself.
#   human = blocked until one of the approvers approves the pull request.
# Each file takes the route of the first rule that matches it, or the default.
# The strictest route among all touched files wins.

default: auto

# GitHub login of the factory App (<app-slug>[bot]). Only pull requests opened by it,
# from a branch of this repository, can auto-merge. Must match the real App slug.
# Empty or missing: nothing is ever auto (fails closed).
factory: murciatech-factory[bot]

# A pull request one of them opens from this repository is already their decision: it passes, never auto-merged.
approvers:
  - IamFranP13

rules:
  # Desarrollo: a feature (src/features/<id>/index.js and its test) goes alone to production when the tests pass.
  # Only these two exact shapes: anything else under src/features/ (the contract, the registry, other files) is platform.
  - paths:
      - "src/features/*/index.js"
      - "src/features/*/index.test.mjs"
    route: auto

  # Estilo: the look of the site (the stylesheet and the presentational components) goes alone to production when the
  # static check of lib/estilo.js passes. Exactly these six files, placed before the src/** rule (the first match wins):
  # the pages, the other components, the layouts and the rest of src/ stay human.
  - paths:
      - "src/styles/global.css"
      - "src/components/Paisaje.astro"
      - "src/components/CampanaCard.astro"
      - "src/components/ProductoCard.astro"
      - "src/components/Header.astro"
      - "src/components/Footer.astro"
    route: auto

  # The business rules of the quote calculator, like data/: a human decides.
  - paths: ["src/domain/**"]
    route: human

  # The platform itself: only humans change the factory.
  - paths:
      - "policy/**"
      - "factory/**"
      - "scripts/**"
      - "lib/**"
      - "functions/**"
      - "brain/**"
      - "design/**"
      - "src/**"
      - "public/**"
      - "site/**"
      - ".github/**"
      - "astro.config.mjs"
      - "AGENTS.md"
      - "package.json"
      - "package-lock.json"
    route: human

  # Marketing: campaigns.
  - paths: ["content/campanas/**"]
    route: auto

  # Producto: new products and export destinations.
  - paths: ["catalogo/**"]
    route: auto

  # Negocio: prices and volume discounts.
  - paths: ["data/**"]
    route: human

  # config/ (transport costs) has no rule: it falls to the default. That is the hole of the demo.
