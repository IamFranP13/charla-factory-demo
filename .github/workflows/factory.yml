name: Factory

# A request from the audience arrives as an issue labelled "entrada".
# The factory turns it into files, and those files into a pull request.
# The risk gate (gate.yml) then decides whether that PR merges by itself.
on:
  issues:
    types: [opened, labeled]

# Least privilege for GITHUB_TOKEN: comment on and close issues, read the code.
# Pushing the branch and opening the PR use the GitHub App token instead.
permissions:
  contents: read
  issues: write

# One run per issue. `opened` and `labeled` both fire when the intake creates a
# labelled issue; the second run waits and then stops at the guard step.
concurrency:
  group: factory-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  factory:
    # Only issues carrying the "entrada" label. On `labeled`, only when that very label was just added.
    if: >-
      contains(github.event.issue.labels.*.name, 'entrada') &&
      (github.event.action == 'opened' || github.event.label.name == 'entrada')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # PRs opened with GITHUB_TOKEN do not trigger workflows (no gate, no CI),
      # so branch and PR are created with a GitHub App installation token.
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

      # The token is used to fetch and then forgotten: `persist-credentials: false` leaves nothing in .git/config for
      # the factory step (which holds the model key and runs the sandbox) to find. The push passes the token explicitly.
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      # Idempotency: skip if the issue is already closed or its branch already exists.
      - id: guard
        run: |
          state=$(gh issue view "$ISSUE" --json state --jq .state)
          if [ "$state" != "OPEN" ] || git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "tarea/$ISSUE" >/dev/null 2>&1; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - if: steps.guard.outputs.proceed == 'true'
        run: npm ci --omit=dev

      - id: factory
        if: steps.guard.outputs.proceed == 'true'
        run: node scripts/factory.mjs --issue "$ISSUE"
        env:
          FACTORY_PROVIDER: ${{ vars.FACTORY_PROVIDER }}
          FACTORY_API_URL: ${{ vars.FACTORY_API_URL }}
          FACTORY_MODEL: ${{ vars.FACTORY_MODEL }}
          FACTORY_CODE_MODEL: ${{ vars.FACTORY_CODE_MODEL }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}

      - id: pr
        if: steps.guard.outputs.proceed == 'true' && steps.factory.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PROFILE: ${{ steps.factory.outputs.profile }}
          FILES: ${{ steps.factory.outputs.files }}
          BASE: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "factory[bot]"
          git config user.email "factory[bot]@users.noreply.github.com"
          git switch -c "tarea/$ISSUE"
          IFS=',' read -ra files <<< "$FILES"
          # Commit only what the factory reported, nothing else in the working tree.
          git add -- "${files[@]}"
          git commit -m "Tarea #$ISSUE ($PROFILE)"
          # Explicit token, passed through the environment: never echoed, never written to .git/config.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "tarea/$ISSUE"
          gh label create "perfil:$PROFILE" --force >/dev/null
          url=$(gh pr create --base "$BASE" --head "tarea/$ISSUE" \
            --title "Tarea #$ISSUE · $PROFILE" \
            --body "Closes #$ISSUE" \
            --label "perfil:$PROFILE")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      # The task state in the issue body is only ever written by the scripts: this one records the PR
      # and puts the task at the gate. The gate (gate.yml) takes over from here.
      - if: steps.pr.outcome == 'success'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: node scripts/factory.mjs --issue "$ISSUE" --pr "$PR_NUMBER"

      # Rejected, failed or errored: say so and close. "ignored" (not our author)
      # is left untouched.
      - if: steps.guard.outputs.proceed == 'true' && steps.factory.outputs.status != 'ok' && steps.factory.outputs.status != 'ignored'
        env:
          STATUS: ${{ steps.factory.outputs.status }}
        run: |
          gh issue close "$ISSUE" --reason "not planned" \
            --comment "La factory no ha podido convertir esta petición en un cambio (resultado: $STATUS). Cierro la tarea."
