name: Rebuild

# A factory pull request that conflicts with main is closed and its task is run again on the current main,
# at most once (the record lives in the task state of the issue). After every push to main.
on:
  push:
    branches: [main]
  # A pull request that opens already conflicting (the last push to main came before it) is found when the factory ends.
  # The code is still main's: the checkout below names no ref.
  workflow_run:
    workflows: [Factory]
    types: [completed]

# GITHUB_TOKEN only reads the code. Everything that writes (close the pull request, delete its branch, comment,
# update the task state, give the label back) uses the factory App token: the label only re-runs the Factory
# workflow when an App adds it.
permissions:
  contents: read

# A burst of merges queues one run behind the one in progress (the older queued run is replaced); each run looks at
# the pull requests as they are when it starts, so none is processed twice at once.
concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # The code of main only, never a pull request's. No credential stays in .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # No dependencies to install: the script only uses the Node standard library and the gh CLI.
      - run: node scripts/rebuild.mjs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
