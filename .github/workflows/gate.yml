name: Risk gate

# SECURITY: pull_request_target runs with write permissions and secrets, so this
# workflow must never run code from the pull request. It checks out the BASE
# branch only and judges the PR through the GitHub API (list of changed files,
# reviews). `pull_request_review` runs with the PR's code by default, so the
# checkout below names the base branch explicitly for every event.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

# contents: write + pull-requests: write is enough to label and comment.
# Auto-merge is enabled with the factory App token instead (see the merge step):
# GitHub does not fire the side effects of a merge done with GITHUB_TOKEN, so the
# linked issue would stay open and the branch would not be deleted.
# Deploying main still comes from Cloudflare Pages' own Git integration.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: risk-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Stable job name: "risk-gate" is the required status check on main.
  # Only the pull request event produces it: a check with the same name from another event
  # lands in a separate check suite, and branch protection keeps seeing the old failure.
  risk-gate:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs the dependencies of the BASE checkout (just `yaml`).
      - run: npm ci

      # The gate exits 1 when it blocks (waiting for a human). That must fail the
      # job, but the label/comment steps below still need to run, so this step
      # is allowed to fail and the last step re-raises its outcome.
      - id: gate
        continue-on-error: true
        run: node scripts/gate.mjs --pr "$PR"

      # The App key is only touched when the gate has already decided to merge.
      # Safe here: this job runs the BASE branch code only, never the PR's.
      - id: app
        if: steps.gate.outputs.merge == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

      # Pin the commit the gate judged: a push after the verdict cancels the merge.
      - if: steps.gate.outputs.merge == 'true'
        env:
          HEAD: ${{ steps.gate.outputs.head }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh pr merge "$PR" --auto --squash --match-head-commit "$HEAD"

      - if: steps.gate.outputs.route == 'human'
        run: |
          gh label create necesita-humano --force >/dev/null
          gh pr edit "$PR" --add-label necesita-humano
          gh pr comment "$PR" --body "Este cambio toca algo sensible: necesita la aprobación de una persona antes de entrar en main."

      - if: always() && steps.gate.outcome != 'success'
        run: |
          echo "Risk gate did not pass (see the gate step above)."
          exit 1

  # An approval (or a dismissed one) re-runs the original risk-gate run, which reads the reviews
  # again and replaces its own check. This job checks nothing out and runs no repository code.
  # On review events GitHub runs the workflow definition from the PR merge ref, so fork PRs are
  # skipped: for them, re-run the failed risk-gate job by hand after approving.
  rerun-gate:
    if: github.event_name == 'pull_request_review' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    env:
      PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow gate.yml --event pull_request_target --commit "$head" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$id" ]; then echo "No risk-gate run found for $head"; exit 1; fi
          # A run still in progress cannot be re-run: wait for it first.
          gh run watch "$id" -R "$GITHUB_REPOSITORY" > /dev/null || true
          gh run rerun "$id" -R "$GITHUB_REPOSITORY"
          echo "Re-ran risk-gate run $id for $head"
