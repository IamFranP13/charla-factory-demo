# Who asks. The server draws one of these at random for every request, in equal parts; nobody chooses.
# The profile is only "who asked": it shows in the trail and on the pages. What a request may change is decided by
# its KIND (factory/kinds.yaml), classified by the Spec writer, never by the profile.
#   kinds:  the default kinds of the profile: what the factory may write when the Spec writer names no kind.
#           (Data only: a profile never defaults to code.)

marketing:
  label: Marketing
  description: Mensajes y banners de campaña de LIMONIA.
  kinds: ["campana"]

producto:
  label: Producto
  description: Funcionalidades del catálogo de LIMONIA, un producto nuevo o un destino de exportación nuevo.
  kinds: ["producto", "destino"]

negocio:
  label: Negocio
  description: Precios, descuentos por volumen y tarifas de transporte de LIMONIA.
  kinds: ["precios", "descuentos", "transporte"]
